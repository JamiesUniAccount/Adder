name: Maven Tests

on:
  push:
    branches:
      -main
      -JamiesUniAccount-patch-1
  pull_request:
    branches:
      -main
      -JamiesUniAccount-patch-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-package:
    name: Test, build and package
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          
      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Package project
        run: npm pack
      
